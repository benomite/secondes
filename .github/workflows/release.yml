name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner ships the Android SDK (ANDROID_HOME) with its own cmdline-tools. The
      # android-actions/setup-android action failed here ("Failed to find package 'tools'"), so the
      # SDK is used as is and only the packages the build needs are installed explicitly.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SECONDES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret SECONDES_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/secondes.jks"

      - name: Build signed release APK
        env:
          SECONDES_VERSION: ${{ github.event.release.tag_name }}
          SECONDES_KEYSTORE_PATH: ${{ runner.temp }}/secondes.jks
          SECONDES_KEYSTORE_PASSWORD: ${{ secrets.SECONDES_KEYSTORE_PASSWORD }}
          SECONDES_KEY_ALIAS: ${{ secrets.SECONDES_KEY_ALIAS }}
          SECONDES_KEY_PASSWORD: ${{ secrets.SECONDES_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature and print APK metadata
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^package:"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "secondes-${VERSION}.apk"
          gh release upload "$TAG" "secondes-${VERSION}.apk" --clobber --repo "$GITHUB_REPOSITORY"
