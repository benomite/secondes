name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SECONDES_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/secondes.jks"

      - name: Build signed release APK
        env:
          SECONDES_VERSION: ${{ github.event.release.tag_name }}
          SECONDES_KEYSTORE_PATH: ${{ runner.temp }}/secondes.jks
          SECONDES_KEYSTORE_PASSWORD: ${{ secrets.SECONDES_KEYSTORE_PASSWORD }}
          SECONDES_KEY_ALIAS: ${{ secrets.SECONDES_KEY_ALIAS }}
          SECONDES_KEY_PASSWORD: ${{ secrets.SECONDES_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "secondes-${VERSION}.apk"
          gh release upload "$TAG" "secondes-${VERSION}.apk" --clobber --repo "$GITHUB_REPOSITORY"
