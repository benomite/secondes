<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html, body { margin: 0; height: 100%; background: #fff; }</style>
</head>
<body>
  <script>
    // Google's Drive file picker, on folders, as in prototypes/drive-picker. The app hands over the access token
    // it got for the drive.file scope (the only scope it asks for); picking a folder grants the app that folder.
    // The answer goes back to the app through the SecondesPicker bridge.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('cannot load ' + src));
        document.head.appendChild(s);
      });
    }

    async function start(token, apiKey, appId) {
      try {
        await loadScript('https://apis.google.com/js/api.js');
        await new Promise((resolve, reject) =>
          gapi.load('picker', { callback: resolve, onerror: () => reject(new Error('picker failed to load')) }));
      } catch (e) {
        SecondesPicker.failed(e.message);
        return;
      }
      const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(true)
        .setMimeTypes('application/vnd.google-apps.folder');
      new google.picker.PickerBuilder()
        .addView(view)
        .enableFeature(google.picker.Feature.SUPPORT_DRIVES)
        .enableFeature(google.picker.Feature.NAV_HIDDEN)
        .setOAuthToken(token)
        .setDeveloperKey(apiKey)
        .setAppId(appId)
        .setOrigin(window.location.protocol + '//' + window.location.host)
        .setSize(window.innerWidth, window.innerHeight)
        .setCallback((data) => {
          if (data.action === google.picker.Action.PICKED) {
            const doc = data.docs[0];
            SecondesPicker.picked(doc.id, doc.name || '');
          } else if (data.action === google.picker.Action.CANCEL) {
            SecondesPicker.cancelled();
          }
        })
        .build()
        .setVisible(true);
    }
  </script>
</body>
</html>
